id: py_api_legacy_messy
category: audit
name: Sample Audit - Python Legacy Order Hub (legacy-order-hub)
description: Evaluate examples/python/api_legacy_messy showcasing multi-module hotspot gradients, cyclic dependencies, supply-chain/Docker risks, and Flask->FastAPI modernization.

targets:
  root: "examples/python/api_legacy_messy"
  source:
    - "order_app"
  tests:
    - "tests"
  docs:
    - "README.md"

steps:
  - id: arch_recording
    uses: architecture_analysis

  - id: repo_and_deps
    uses: repo_structure_audit

  - id: supply_chain
    uses: supply_chain_audit

  - id: ast_and_quality
    uses: python_ast_audit

  - id: service_readiness
    uses: service_readiness_audit

  - id: test_health
    uses: python_test_audit

  - id: runtime_verification
    uses: container_runtime_audit

  - id: security_audit
    uses: security_vulnerability_audit

  - id: web_pentest
    uses: web_penetration_audit

  - id: output_score
    uses: emit_score
    with:
      output_dir: "reports/python"
      target: "api_legacy_messy"

  - id: create_report
    uses: write_drawlib_report
    with:
      src_dir: "reports_src/python"
      output_dir: "reports/python"
      target: "api_legacy_messy"
      lang: "ja"
      style: "google"
