id: java_api_spring_messy
category: audit
name: Sample Audit - Java Legacy Spring Service (legacy-billing-service)
description: Workflow v2 DAG audit of examples/java/api_spring_messy showcasing Java 8/Spring 2 debt, field injection, cyclic packages, raw generics, missing I/O timeouts, JUnit 4 assertion-free tests, Trivy, and live DAST pentest.

targets:
  root: "examples/java/api_spring_messy"
  source:
    - "src/main/java"
  tests:
    - "src/test/java"
  docs:
    - "README.md"

steps:
  - id: repo_and_deps
    uses: java/repo_structure_audit

  - id: supply_chain
    uses: supply_chain_audit
    needs: [repo_and_deps]

  - id: ast_and_quality
    uses: java_ast_audit
    needs: [repo_and_deps]

  - id: runtime_verification
    uses: container_runtime_audit
    needs: [repo_and_deps]
    when: "has_runtime_harness"

  - id: security_audit
    uses: security_vulnerability_audit
    needs: [repo_and_deps]

  - id: web_pentest
    uses: web_penetration_audit
    needs: [repo_and_deps]

  - id: arch_recording
    uses: architecture_analysis
    needs: [ast_and_quality]

  - id: service_readiness
    uses: service_readiness_audit
    needs: [ast_and_quality]

  - id: test_health
    uses: java_test_audit
    needs: [ast_and_quality]

  - id: output_score
    uses: emit_score
    needs: [supply_chain, arch_recording, service_readiness, test_health, runtime_verification, security_audit, web_pentest]
    with:
      output_dir: "docs/reports/java_api_spring_messy"
      target: "java_api_spring_messy"

  - id: create_report
    uses: write_drawlib_report
    needs: [output_score]
    with:
      src_dir: "docs_src/reports/java_api_spring_messy"
      output_dir: "docs/reports/java_api_spring_messy"
      target: "java_api_spring_messy"
      lang: "en,ja"
      style: "google"
      formats:
        - "pdf"
        - "html"
