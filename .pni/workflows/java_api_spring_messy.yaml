id: java_api_spring_messy
category: audit
name: Sample Audit - Java Legacy Spring Service (legacy-billing-service)
description: Evaluate examples/java/api_spring_messy showcasing Java 8/Spring 2 debt, field injection, cyclic packages, raw generics, missing I/O timeouts, and JUnit 4 assertion-free tests.

targets:
  root: "examples/java/api_spring_messy"
  source:
    - "src/main/java"
  tests:
    - "src/test/java"
  docs:
    - "README.md"

steps:
  - id: arch_recording
    uses: architecture_analysis

  - id: repo_and_deps
    uses: java/repo_structure_audit

  - id: supply_chain
    uses: supply_chain_audit

  - id: ast_and_quality
    uses: java_ast_audit

  - id: service_readiness
    uses: service_readiness_audit

  - id: test_health
    uses: java_test_audit

  - id: runtime_verification
    uses: container_runtime_audit

  - id: security_audit
    uses: security_vulnerability_audit

  - id: web_pentest
    uses: web_penetration_audit

  - id: output_score
    uses: emit_score
    with:
      output_dir: "reports/java"
      target: "api_spring_messy"

  - id: create_report
    uses: write_drawlib_report
    with:
      src_dir: "reports_src/java"
      output_dir: "reports/java"
      target: "api_spring_messy"
      lang: "ja"
      style: "google"
