name: Build and Publish pni501-extra-grammars

on:
  workflow_dispatch:
    inputs:
      publish:
        description: "Upload built wheels to PyPI"
        required: false
        default: "false"
  push:
    tags:
      - "extra-grammars-v*"

permissions:
  contents: read

jobs:
  build_wheels:
    name: Build wheels on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch pinned MIT grammar C sources
        run: python packages/pni501-extra-grammars/scripts/fetch_grammars.py

      - name: Set up QEMU (Linux aarch64)
        if: runner.os == 'Linux'
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Build ABI3 wheels with cibuildwheel
        uses: pypa/cibuildwheel@v2.22
        with:
          package-dir: packages/pni501-extra-grammars
          output-dir: wheelhouse
        env:
          CIBW_ARCHS_LINUX: x86_64 aarch64

      - uses: actions/upload-artifact@v4
        with:
          name: extra-grammars-wheels-${{ matrix.os }}
          path: wheelhouse/*.whl

  publish:
    needs: build_wheels
    if: startsWith(github.ref, 'refs/tags/extra-grammars-v') || inputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: extra-grammars-wheels-*
          path: dist
          merge-multiple: true

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
