syntax = "proto3";

package sample.inventory.v1;

message StockItemRecord1 {
  string record_id = 1;
  int32 quantity = 2;
  double unit_price = 3;
  int32 tier = 4;
  string currency_code = 5;
  int64 created_epoch_ms = 6;
}

