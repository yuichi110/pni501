[build-system]
requires = ["uv-build<0.12"]
build-backend = "uv_build"

[project]
name = "logpulse"
version = "0.2.1"
description = "Structured JSONL log triage and error burst summarization CLI."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "rich>=13.7.0",
    "typer>=0.12.0",
]

[project.scripts]
logpulse = "logpulse.cli:app"

[tool.uv.build-backend]
module-name = "logpulse"

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "ruff>=0.9.0",
]
