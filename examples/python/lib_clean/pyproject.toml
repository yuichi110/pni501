[build-system]
requires = ["uv-build<0.12"]
build-backend = "uv_build"

[project]
name = "metrics-kit"
version = "0.4.2"
description = "Typed statistical aggregation, EWMA smoothing, and threshold rule evaluation library."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = [
    "pydantic>=2.7.0",
]

[tool.uv.build-backend]
module-name = "metrics_kit"

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.9.0",
    "ty>=0.0.35",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "ANN", "D", "PL"]
