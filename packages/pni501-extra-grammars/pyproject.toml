[build-system]
requires = ["setuptools>=70.1"]
build-backend = "setuptools.build_meta"

[project]
name = "pni501-extra-grammars"
version = "0.1.0"
description = "Cross-platform prebuilt Tree-sitter ABI3 grammar wheels (COBOL, R, Vue, Protobuf, Dockerfile) for pni501."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{name = "Yuichi Ito", email = "yuichi@yuichi.com"}]
classifiers = [
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Compilers",
]

[project.urls]
Repository = "https://github.com/yuichi110/pni501"

[tool.setuptools]
packages = ["pni501_extra_grammars"]

[tool.setuptools.package-data]
pni501_extra_grammars = ["py.typed", "*.pyi", "THIRD_PARTY_LICENSES.txt"]

[tool.cibuildwheel]
build = "cp312-*"
skip = ["*-musllinux_*", "*-win32", "*-manylinux_i686"]
test-requires = ["tree-sitter>=0.25.0"]
test-command = "python -c \"import tree_sitter, pni501_extra_grammars as g; [tree_sitter.Language(getattr(g, f'language_{k}')()) for k in g.available_languages()]; print('OK:', g.available_languages())\""

[tool.cibuildwheel.linux]
manylinux-x86_64-image = "manylinux2014"
manylinux-aarch64-image = "manylinux2014"

[tool.cibuildwheel.macos]
archs = ["arm64", "x86_64"]

[tool.cibuildwheel.windows]
archs = ["AMD64"]
