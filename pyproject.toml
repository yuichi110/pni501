[build-system]
requires = ["uv-build<0.12"]
build-backend = "uv_build"

[project]
name = "pni501"
version = "0.1.4"
description = "Project Nemesis Index (PNI) - Evaluate software development project health and generate reports."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{name = "Yuichi Ito", email = "yuichi@yuichi.com"}]
dependencies = [
    "typer>=0.12.0",
    "rich>=13.0.0",
    "pydantic>=2.0.0",
    "pyyaml>=6.0.0",
    "drawlib>=0.3.15",
    "playwright>=1.64.0",
    "tree-sitter>=0.25.0",
    # Tier A & Core languages (PyPI cross-platform abi3 wheels)
    "tree-sitter-python>=0.25.0",
    "tree-sitter-java>=0.23.5",
    "tree-sitter-php>=0.25.2",
    "tree-sitter-go>=0.25.0",
    "tree-sitter-typescript>=0.23.2",
    "tree-sitter-javascript>=0.25.0",
    "tree-sitter-c-sharp>=0.24.0",
    "tree-sitter-rust>=0.24.2",
    "tree-sitter-ruby>=0.23.1",
    "tree-sitter-kotlin>=1.1.0",
    "tree-sitter-swift>=0.7.4",
    "tree-sitter-c>=0.24.2",
    "tree-sitter-cpp>=0.23.4",
    "tree-sitter-scala>=0.26.13",
    "tree-sitter-dart>=0.1.0",
    "tree-sitter-elixir>=0.3.5",
    "tree-sitter-perl>=2.1.2",
    # Tier B static-audit languages (PyPI cross-platform abi3 wheels)
    "tree-sitter-bash>=0.25.1",
    "tree-sitter-powershell>=0.26.4",
    "tree-sitter-groovy>=0.1.2",
    "tree-sitter-objc>=3.0.2",
    "tree-sitter-lua>=0.5.0",
    "tree-sitter-haskell>=0.24.1",
    "tree-sitter-fsharp>=0.3.13",
    "tree-sitter-ocaml>=0.26.0",
    "tree-sitter-zig>=1.1.2",
    "tree-sitter-julia>=0.23.1",
    "tree-sitter-fortran>=0.6.0",
    "tree-sitter-matlab>=1.3.4",
    "tree-sitter-svelte>=1.0.2",
    "tree-sitter-solidity>=1.2.13",
    "tree-sitter-cuda>=0.21.2",
    "tree-sitter-verilog>=1.0.3",
    "tree-sitter-vhdl>=2.1.0",
    "tree-sitter-ada>=0.9.2",
    "tree-sitter-odin>=1.3.0",
    "tree-sitter-commonlisp>=0.4.1",
    # Tier C polyglot IaC, schema, build & config languages (PyPI cross-platform abi3 wheels)
    "tree-sitter-hcl>=1.2.0",
    "tree-sitter-bicep>=1.1.0",
    "tree-sitter-nix>=0.1.0",
    "tree-sitter-make>=1.1.1",
    "tree-sitter-starlark>=1.3.0",
    "tree-sitter-sql>=0.3.13",
    "tree-sitter-html>=0.23.2",
    "tree-sitter-css>=0.25.0",
    "tree-sitter-scss>=1.0.0",
    "tree-sitter-yaml>=0.7.2",
    "tree-sitter-json>=0.24.8",
    "tree-sitter-toml>=0.7.0",
    "tree-sitter-xml>=0.7.0",
    # Companion MIT grammar bundle (COBOL, R, Vue, Protobuf, Dockerfile)
    "pni501-extra-grammars>=0.1.0",
    "httpx>=0.28.0",
    "pytest>=8.3.0",
]

[project.urls]
Repository = "https://github.com/yuichi110/pni501"

[project.scripts]
pni = "pni.cli:main"
pni501 = "pni.cli:main"

[tool.uv.build-backend]
module-name = "pni"

[tool.uv.sources]
pni501-extra-grammars = { path = "packages/pni501-extra-grammars", editable = false }

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"

[dependency-groups]
dev = [
    "ruff>=0.9.0",
    "pytest>=8.3.0",
    "pytest-cov>=6.0.0",
    "tomlkit>=0.14.0",
    "ty>=0.0.35",
    "typer>=0.12.0",
    "rich>=13.0.0",
    "pytest-xdist>=3.8.0",
]

[tool.ruff]
preview = false
fix = true
unsafe-fixes = false
line-length = 120
exclude = ["examples", "packages"]

[tool.ruff.lint]
select = [
    "C90", # mccabe 
    "F",   # Pyflakes
    "D",   # pydocstyle
    "E",   # Pycodestyle Error
    "I",   # isort
    "N",   # pep8-naming (N)
    "W",   # Pycodestyle Warning
    "ANN", # flake8-annotations (ANN)
    "CPY", # flake8-copyright
    "S",   # flake8-bandit
    "PL"   # Pylint
]

ignore = [
    "D203",    # 1 blank line required before class docstring
    "D212",    # Multi-line docstring summary should start at the first line
    "D415",    # First line should end with a period, question mark, or exclamation point
    "F401",    # imported but unused
    "PLC0414", # Import alias does not rename original package
    "PLC1901", # compare-to-empty-string
    "PLR0904", # Too many public methods
    "PLR0912", # Too many branches
    "PLR0913", # Too many arguments in function definition
    "PLR0914", # Too many local variables
    "PLR0915", # Too many statements
    "PLR0917", # Too many positional arguments
    "PLR2004", # Magic value used in comparison
    "PLW2901"  # Outer variable overwritten by inner target
]

[tool.ruff.lint.per-file-ignores]
"tools/**.py" = [
    "ANN",     # flake8-annotations
    "S101",    # Use of assert detected
    "S310",    # Audit URL open for permitted schemes
    "S404",    # Subprocess module usage
    "S603",    # Subprocess call without shell=True
    "S607",    # Subprocess with partial executable path
    "PLC2701", # Private name import from external module
    "PLR6301", # Method could be a function/static method
]
"tests/**.py" = [
    "F403", # undefined-local-with-import-star
    "F405", # undefined-local-with-import-star-usage
    "D100", # undocumented-public-module
    "D101", # undocumented-public-class
    "D102", # undocumented-public-method
    "D103", # undocumented-public-function
    "D104", # undocumented-public-package
    "D107", # undocumented-public-init
    "ANN",  # flake8-annotations
    "CPY",  # flake8-copyright
    "S101", # Use of assert detected
    "PLC2701", # Private name import from external module (standard for unit tests)
    "PLR6301" # Method could be a function/static method (standard for pytest classes)
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.pytest.ini_options]
testpaths = ["tests"]
