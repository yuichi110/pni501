[build-system]
requires = ["setuptools>=70.1"]
build-backend = "setuptools.build_meta"

[project]
name = "pni501-extra-grammars"
version = "0.2.0"
description = "Internal ABI3 Tree-sitter grammar builder for pni501 GitHub Release assets."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{name = "Yuichi Ito", email = "yuichi@yuichi.com"}]

[tool.setuptools]
packages = ["pni501_extra_grammars"]

[tool.setuptools.package-data]
pni501_extra_grammars = ["py.typed", "*.pyi", "THIRD_PARTY_LICENSES.txt"]

[tool.cibuildwheel]
build = "cp312-*"
skip = ["*-musllinux_*", "*-win32", "*-manylinux_i686"]
test-requires = ["tree-sitter>=0.25.0"]
test-command = "python -c \"import tree_sitter, pni501_extra_grammars as g; [tree_sitter.Language(getattr(g, f'language_{k}')()) for k in g.available_languages()]; print('OK:', g.available_languages())\""
test-skip = ["*-macosx_x86_64"]

[tool.cibuildwheel.linux]
manylinux-x86_64-image = "manylinux2014"
manylinux-aarch64-image = "manylinux2014"

[tool.cibuildwheel.macos]
archs = ["arm64", "x86_64"]

[tool.cibuildwheel.windows]
archs = ["AMD64"]
