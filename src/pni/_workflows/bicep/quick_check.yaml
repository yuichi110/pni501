id: quick_check
category: audit
name: Quick Azure IaC Check (Bicep)
description: Fast deterministic Bicep AST and config check followed by AI interpretation and score output.

targets:
  source:
    - "."
    - "infra"
    - "bicep"
  tests: []
  docs:
    - "README.md"

steps:
  - id: repo_and_deps
    uses: repo_structure_audit

  - id: ast_and_quality
    uses: bicep_ast_audit
    needs: [repo_and_deps]

  - id: output_score
    uses: emit_score
    needs: [ast_and_quality]
