id: quick_check
category: audit
name: Quick Health Check (Zig)
description: Fast deterministic Zig AST and build.zig check followed by AI interpretation and score output.

targets:
  source:
    - "src"
    - "."
  tests:
    - "tests"
    - "src"
  docs:
    - "README.md"

steps:
  - id: repo_and_deps
    uses: repo_structure_audit

  - id: ast_and_quality
    uses: zig_ast_audit
    needs: [repo_and_deps]

  - id: output_score
    uses: emit_score
    needs: [ast_and_quality]
