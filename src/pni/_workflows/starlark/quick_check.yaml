id: quick_check
category: audit
name: Quick Bazel / Starlark Build Check (Starlark)
description: Fast deterministic Starlark AST and MODULE.bazel check followed by AI interpretation and score output.

targets:
  source:
    - "."
  tests: []
  docs:
    - "README.md"
  exclude:
    - "bazel-*/**"

steps:
  - id: repo_and_deps
    uses: repo_structure_audit

  - id: ast_and_quality
    uses: starlark_ast_audit
    needs: [repo_and_deps]

  - id: output_score
    uses: emit_score
    needs: [ast_and_quality]
