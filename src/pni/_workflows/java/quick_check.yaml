id: quick_check
category: audit
name: Quick Health Check (Java)
description: Fast deterministic Java AST and Maven/Gradle check followed by AI interpretation and score output.

targets:
  source:
    - "src/main/java"
  tests:
    - "src/test/java"
  docs:
    - "README.md"

steps:
  - id: repo_and_deps
    uses: repo_structure_audit

  - id: ast_and_quality
    uses: java_ast_audit

  - id: output_score
    uses: emit_score
