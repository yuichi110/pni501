id: quick_check
category: audit
name: Quick Configuration & CI Security Check (YAML)
description: Fast deterministic YAML AST and CI/K8s security check followed by AI interpretation and score output.

targets:
  source:
    - "."
    - ".github/workflows"
  tests: []
  docs:
    - "README.md"

steps:
  - id: repo_and_deps
    uses: repo_structure_audit

  - id: ast_and_quality
    uses: yaml_ast_audit
    needs: [repo_and_deps]

  - id: output_score
    uses: emit_score
    needs: [ast_and_quality]
