id: quick_check
category: audit
name: Quick Markup & Security Check (HTML)
description: Fast deterministic HTML AST and security check followed by AI interpretation and score output.

targets:
  source:
    - "templates"
    - "public"
    - "src"
    - "."
  tests: []
  docs:
    - "README.md"

steps:
  - id: repo_and_deps
    uses: repo_structure_audit

  - id: ast_and_quality
    uses: html_ast_audit
    needs: [repo_and_deps]

  - id: output_score
    uses: emit_score
    needs: [ast_and_quality]
