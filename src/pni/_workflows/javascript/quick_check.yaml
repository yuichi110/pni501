id: quick_check
category: audit
name: Quick Health Check (JavaScript)
description: Fast deterministic JavaScript AST and package.json check followed by AI interpretation and score output.

targets:
  source:
    - "src"
  tests:
    - "tests"
  docs:
    - "README.md"

steps:
  - id: repo_and_deps
    uses: repo_structure_audit

  - id: ast_and_quality
    uses: javascript_ast_audit

  - id: output_score
    uses: emit_score
