id: quick_check
category: audit
name: Quick Health Check (Elixir)
description: Fast deterministic Elixir AST and mix.exs check followed by AI interpretation and score output.

targets:
  source:
    - "lib"
    - "src"
  tests:
    - "test"
  docs:
    - "README.md"

steps:
  - id: repo_and_deps
    uses: repo_structure_audit

  - id: ast_and_quality
    uses: elixir_ast_audit
    needs: [repo_and_deps]

  - id: output_score
    uses: emit_score
    needs: [ast_and_quality]
