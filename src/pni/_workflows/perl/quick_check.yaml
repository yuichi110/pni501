id: quick_check
category: audit
name: Quick Health Check (Perl)
description: Fast deterministic Perl AST and CPAN manifest check followed by AI interpretation and score output.

targets:
  source:
    - "lib"
    - "bin"
    - "src"
    - "."
  tests:
    - "t"
    - "tests"
  docs:
    - "README.md"
  exclude:
    - "local/**"

steps:
  - id: repo_and_deps
    uses: repo_structure_audit

  - id: ast_and_quality
    uses: perl_ast_audit
    needs: [repo_and_deps]

  - id: output_score
    uses: emit_score
    needs: [ast_and_quality]
