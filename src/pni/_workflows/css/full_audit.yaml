id: full_audit
category: audit
name: Full Stylesheet Quality & Accessibility Audit & Report (CSS)
description: Workflow v2 DAG — Plan-First alignment, parallel deterministic CSS AST & security analysis, grounded layer/token architecture, score+SARIF emission, and Drawlib report.

targets:
  source:
    - "styles"
    - "src"
    - "public"
    - "."
  tests: []
  docs:
    - "README.md"

steps:
  - id: repo_and_deps
    uses: repo_structure_audit

  - id: ast_and_quality
    uses: css_ast_audit
    needs: [repo_and_deps]

  - id: security_audit
    uses: security_vulnerability_audit
    needs: [repo_and_deps]

  - id: arch_recording
    uses: architecture_analysis
    needs: [ast_and_quality]

  - id: test_health
    uses: css_test_audit
    needs: [ast_and_quality]

  - id: output_score
    uses: emit_score
    needs: [arch_recording, test_health, security_audit]

  - id: create_report
    uses: write_drawlib_report
    needs: [output_score]
