id: quick_check
category: audit
name: Quick Stylesheet Quality Check (CSS)
description: Fast deterministic CSS AST and cascade check followed by AI interpretation and score output.

targets:
  source:
    - "styles"
    - "src"
    - "public"
    - "."
  tests: []
  docs:
    - "README.md"

steps:
  - id: repo_and_deps
    uses: repo_structure_audit

  - id: ast_and_quality
    uses: css_ast_audit
    needs: [repo_and_deps]

  - id: output_score
    uses: emit_score
    needs: [ast_and_quality]
