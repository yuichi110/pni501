id: quick_check
category: audit
name: Quick Health Check (Groovy)
description: Fast deterministic Groovy AST and build check followed by AI interpretation and score output.

targets:
  source:
    - "src/main/groovy"
    - "src"
    - "vars"
    - "."
  tests:
    - "src/test/groovy"
    - "test"
    - "tests"
  docs:
    - "README.md"

steps:
  - id: repo_and_deps
    uses: repo_structure_audit

  - id: ast_and_quality
    uses: groovy_ast_audit
    needs: [repo_and_deps]

  - id: output_score
    uses: emit_score
    needs: [ast_and_quality]
