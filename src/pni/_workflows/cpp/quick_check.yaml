id: quick_check
category: audit
name: Quick Health Check (C++)
description: Fast deterministic C++ AST and CMake/package check followed by AI interpretation and score output.

targets:
  source:
    - "src"
    - "include"
    - "."
  tests:
    - "tests"
    - "test"
  docs:
    - "README.md"

steps:
  - id: repo_and_deps
    uses: repo_structure_audit

  - id: ast_and_quality
    uses: cpp_ast_audit
    needs: [repo_and_deps]

  - id: output_score
    uses: emit_score
    needs: [ast_and_quality]
