id: quick_check
category: audit
name: Quick Health Check (PHP)
description: Fast deterministic PHP AST and Composer/Raw-PHP check followed by AI interpretation and score output.

targets:
  source:
    - "app"
    - "src"
    - "routes"
  tests:
    - "tests"
  docs:
    - "README.md"

steps:
  - id: repo_and_deps
    uses: repo_structure_audit

  - id: ast_and_quality
    uses: php_ast_audit

  - id: output_score
    uses: emit_score
