id: full_audit
category: audit
name: Full Project Health Audit & Report (PHP)
description: Deterministic PHP AST/Composer/Raw-PHP analysis, 3-aspect grounded architecture recording, container syntax/PHPUnit/Trivy verification, score emission, and drawlib report creation.

targets:
  source:
    - "app"
    - "src"
    - "routes"
  tests:
    - "tests"
  docs:
    - "README.md"

steps:
  - id: repo_and_deps
    uses: repo_structure_audit

  - id: ast_and_quality
    uses: php_ast_audit

  - id: arch_recording
    uses: architecture_analysis

  - id: test_health
    uses: php_test_audit

  - id: runtime_verification
    uses: container_runtime_audit

  - id: security_audit
    uses: security_vulnerability_audit

  - id: output_score
    uses: emit_score

  - id: create_report
    uses: write_drawlib_report
