id: quick_check
category: audit
name: Quick Database & SQL Check (SQL)
description: Fast deterministic SQL AST and migration check followed by AI interpretation and score output.

targets:
  source:
    - "migrations"
    - "sql"
    - "db"
    - "."
  tests: []
  docs:
    - "README.md"

steps:
  - id: repo_and_deps
    uses: repo_structure_audit

  - id: ast_and_quality
    uses: sql_ast_audit
    needs: [repo_and_deps]

  - id: output_score
    uses: emit_score
    needs: [ast_and_quality]
