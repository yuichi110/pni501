id: quick_check
category: audit
name: Quick Health Check (Dart)
description: Fast deterministic Dart AST and pubspec.yaml check followed by AI interpretation and score output.

targets:
  source:
    - "lib"
    - "bin"
    - "src"
  tests:
    - "test"
    - "tests"
  docs:
    - "README.md"
  exclude:
    - "**/*.g.dart"
    - "**/*.freezed.dart"

steps:
  - id: repo_and_deps
    uses: repo_structure_audit

  - id: ast_and_quality
    uses: dart_ast_audit
    needs: [repo_and_deps]

  - id: output_score
    uses: emit_score
    needs: [ast_and_quality]
