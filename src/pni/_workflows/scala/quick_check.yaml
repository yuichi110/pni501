id: quick_check
category: audit
name: Quick Health Check (Scala)
description: Fast deterministic Scala AST and build.sbt check followed by AI interpretation and score output.

targets:
  source:
    - "src/main/scala"
    - "src"
  tests:
    - "src/test/scala"
    - "tests"
  docs:
    - "README.md"

steps:
  - id: repo_and_deps
    uses: repo_structure_audit

  - id: ast_and_quality
    uses: scala_ast_audit
    needs: [repo_and_deps]

  - id: output_score
    uses: emit_score
    needs: [ast_and_quality]
