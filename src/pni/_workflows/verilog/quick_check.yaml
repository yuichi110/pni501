id: quick_check
category: audit
name: Quick RTL Health Check (Verilog / SystemVerilog)
description: Fast deterministic Verilog/SystemVerilog AST and layout check followed by AI interpretation and score output.

targets:
  source:
    - "rtl"
    - "src"
    - "hdl"
    - "."
  tests:
    - "tb"
    - "sim"
    - "tests"
  docs:
    - "README.md"

steps:
  - id: repo_and_deps
    uses: repo_structure_audit

  - id: ast_and_quality
    uses: verilog_ast_audit
    needs: [repo_and_deps]

  - id: output_score
    uses: emit_score
    needs: [ast_and_quality]
