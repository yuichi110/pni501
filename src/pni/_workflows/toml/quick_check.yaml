id: quick_check
category: audit
name: Quick Configuration Check (TOML)
description: Fast deterministic TOML AST and secret/schema check followed by AI interpretation and score output.

targets:
  source:
    - "."
  tests: []
  docs:
    - "README.md"

steps:
  - id: repo_and_deps
    uses: repo_structure_audit

  - id: ast_and_quality
    uses: toml_ast_audit
    needs: [repo_and_deps]

  - id: output_score
    uses: emit_score
    needs: [ast_and_quality]
