id: quick_check
category: audit
name: Quick Health Check (Kotlin)
description: Fast deterministic Kotlin AST and Gradle/Maven check followed by AI interpretation and score output.

targets:
  source:
    - "src/main/kotlin"
    - "src"
  tests:
    - "src/test/kotlin"
    - "tests"
  docs:
    - "README.md"

steps:
  - id: repo_and_deps
    uses: repo_structure_audit

  - id: ast_and_quality
    uses: kotlin_ast_audit
    needs: [repo_and_deps]

  - id: output_score
    uses: emit_score
    needs: [ast_and_quality]
