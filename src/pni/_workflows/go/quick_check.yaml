id: quick_check
category: audit
name: Quick Health Check (Go)
description: Fast deterministic Go AST and go.mod check followed by AI interpretation and score output.

targets:
  source:
    - "."
  tests:
    - "."
  docs:
    - "README.md"

steps:
  - id: repo_and_deps
    uses: repo_structure_audit

  - id: ast_and_quality
    uses: go_ast_audit

  - id: output_score
    uses: emit_score
