id: repo_structure_audit
name: Repository Structure & Podfile/SDK Manifest Audit (Objective-C)
description: Deterministically inspect Podfile, Podfile.lock, podspecs, deployment targets, and documentation, then have AI evaluate against rules.
rules:
  - common/supply_chain
  - common/documentation
  - common/git_workflow
  - common/security
  - objc/dependencies
primitives:
  - type: project_inspect
    name: Extract Objective-C Podfile, Supply-Chain & Dependency Facts
    with:
      lang: "objc"
  - type: ai_interpret
    name: Evaluate Objective-C Build, Supply Chain & Dependencies
    prompt: |
      Review the deterministic ProjectFacts (`runtime_types`, `build_system`, `manifest_files`, `lockfiles_found`, `dependencies`, `unpinned_dependencies`, `language_version_constraint`, `has_license`, `has_security_policy`, `ci_supply_chain_issues`, `committed_secret_files`, `readme_headings`, `docs_inventory`, `has_gitignore`).
      Verify compliance with `common/supply_chain`, `objc/dependencies`, `common/documentation`, `common/git_workflow`, and `common/security`.
