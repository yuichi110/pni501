id: make_ast_audit
name: Makefile AST, Recipe Safety, .PHONY & Shell-Injection Audit
description: Parse Makefiles via tree-sitter to extract .PHONY/.DELETE_ON_ERROR hygiene, rm-rf empty-var and curl|sh sinks, recursive shell assignments, and recipe complexity.
rules:
  - common/architecture
  - common/maintainability
  - common/security
  - common/security_vulnerability
  - make/code_quality
  - make/typing
  - make/modern_stack
primitives:
  - type: ast_analyze
    name: Extract Deterministic Makefile AST & Recipe Metrics
    with:
      lang: "make"
  - type: ai_interpret
    name: Interpret Makefile AST Facts & Evaluate Recipe Safety/Hygiene
    prompt: |
      Inspect the deterministic AstFacts (`docstring_coverage_pct`, `complex_functions`, `bug_risk_idioms`, `hardcoded_secrets`, `dangerous_sinks`, `modernization_hints`).
      Read flagged `Makefile`/`*.mk` files to evaluate target graph modularity (`common/architecture`), recipe injection & `rm -rf $(VAR)/` hazards (`common/security`, `common/security_vulnerability`, `make/code_quality`), variable expansion semantics (`make/typing`), and modern GNU Make headers (`make/modern_stack`).
