id: repo_structure_audit
name: Repository Structure & Zig Build Manifest Audit (Zig)
description: Deterministically inspect build.zig, build.zig.zon, Zig version bounds, and documentation, then have AI evaluate against rules.
rules:
  - common/supply_chain
  - common/documentation
  - common/git_workflow
  - common/security
  - zig/dependencies
primitives:
  - type: project_inspect
    name: Extract Zig Build, Supply-Chain & Dependency Facts
    with:
      lang: "zig"
  - type: ai_interpret
    name: Evaluate Zig Build, Supply Chain & Dependencies
    prompt: |
      Review the deterministic ProjectFacts (`runtime_types`, `build_system`, `manifest_files`, `dependencies`, `unpinned_dependencies`, `language_version_constraint`, `has_license`, `has_security_policy`, `ci_supply_chain_issues`, `committed_secret_files`, `readme_headings`, `docs_inventory`, `has_gitignore`).
      Verify compliance with `common/supply_chain`, `zig/dependencies` (noting `build.zig.zon` embeds content hashes directly), `common/documentation`, `common/git_workflow`, and `common/security`.
