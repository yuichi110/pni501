id: repo_structure_audit
name: Repository Structure & DESCRIPTION/renv Manifest Audit (R)
description: Deterministically inspect DESCRIPTION, NAMESPACE, renv.lock, R version bounds, dependencies, and documentation, then have AI evaluate against rules.
rules:
  - common/supply_chain
  - common/documentation
  - common/git_workflow
  - common/security
  - r/dependencies
primitives:
  - type: project_inspect
    name: Extract R DESCRIPTION/renv, Supply-Chain & Dependency Facts
    with:
      lang: "r"
  - type: ai_interpret
    name: Evaluate R Package Build, Supply Chain & Dependencies
    prompt: |
      Review the deterministic ProjectFacts (`runtime_types`, `build_system`, `manifest_files`, `lockfiles_found`, `dependencies`, `unpinned_dependencies`, `dev_dependencies`, `language_version_constraint`, `has_license`, `has_security_policy`, `has_dependency_automation`, `ci_supply_chain_issues`, `committed_secret_files`, `container_hygiene_issues`, `readme_headings`, `docs_inventory`, `has_gitignore`).
      Verify compliance with `common/supply_chain`, `r/dependencies` (noting published CRAN packages legitimately omit `renv.lock`), `common/documentation`, `common/git_workflow`, and `common/security`.
