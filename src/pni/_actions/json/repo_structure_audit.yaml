id: repo_structure_audit
name: Repository Structure & JSON Config Governance Audit (JSON)
description: Deterministically inspect JSON config/schema layout, committed secret files, and documentation, then have AI evaluate against rules.
rules:
  - common/supply_chain
  - common/documentation
  - common/git_workflow
  - common/security
  - json/dependencies
primitives:
  - type: project_inspect
    name: Extract JSON Config, Secret-File & Governance Facts
    with:
      lang: "json"
  - type: ai_interpret
    name: Evaluate JSON Schema References, Secret Hygiene & Governance
    prompt: |
      Review the deterministic ProjectFacts (`manifest_files`, `has_license`, `has_security_policy`, `ci_supply_chain_issues`, `committed_secret_files`, `readme_headings`, `docs_inventory`, `has_gitignore`).
      Verify compliance with `common/supply_chain`, `json/dependencies` (noting standalone JSON repos omit lockfiles legitimately), `common/documentation`, `common/git_workflow`, and `common/security`.
