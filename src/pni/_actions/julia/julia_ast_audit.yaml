id: julia_ast_audit
name: Julia AST, Type Stability, Global Hygiene, Docs & Security Audit
description: Parse Julia AST via tree-sitter to extract docstring coverage, non-const mutable globals, abstract/Any struct fields, eval(Meta.parse()) CWE sinks, complexity, and web routes.
rules:
  - common/architecture
  - common/maintainability
  - common/security
  - common/security_vulnerability
  - julia/code_quality
  - julia/typing
  - julia/modern_stack
primitives:
  - type: ast_analyze
    name: Extract Deterministic Julia AST & Module Metrics
    with:
      lang: "julia"
  - type: ai_interpret
    name: Interpret Julia AST Facts & Evaluate Type Stability/Quality/Security
    prompt: |
      Inspect the deterministic AstFacts (`wildcard_imports`, `type_safety_coverage_pct`, `weak_type_usages`, `docstring_coverage_pct`, `missing_docstrings`, `complex_functions`, `excessive_parameters`, `bug_risk_idioms`, `global_state_usages`, `missing_io_timeouts`, `unstructured_logging`, `hardcoded_secrets`, `dangerous_sinks`, `api_endpoints`).
      Read flagged `.jl` files to evaluate module layering (`common/architecture`), SIG maintainability (`common/maintainability`), `eval(Meta.parse())` & shell CWE sinks (`common/security`, `common/security_vulnerability`), non-`const` globals & concrete struct type stability (`julia/code_quality`, `julia/typing`), and Julia 1.10+ idioms (`julia/modern_stack`).
