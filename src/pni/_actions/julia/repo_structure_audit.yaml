id: repo_structure_audit
name: Repository Structure & Project.toml Manifest Audit (Julia)
description: Deterministically inspect Project.toml, Manifest.toml, [compat] bounds, and documentation, then have AI evaluate against rules.
rules:
  - common/supply_chain
  - common/documentation
  - common/git_workflow
  - common/security
  - julia/dependencies
primitives:
  - type: project_inspect
    name: Extract Julia Pkg, Supply-Chain & Dependency Facts
    with:
      lang: "julia"
  - type: ai_interpret
    name: Evaluate Julia Pkg Build, Supply Chain & Dependencies
    prompt: |
      Review the deterministic ProjectFacts (`runtime_types`, `build_system`, `manifest_files`, `lockfiles_found`, `dependencies`, `unpinned_dependencies`, `language_version_constraint`, `has_license`, `has_security_policy`, `ci_supply_chain_issues`, `committed_secret_files`, `readme_headings`, `docs_inventory`, `has_gitignore`).
      Verify compliance with `common/supply_chain`, `julia/dependencies` (noting published Julia packages omit `Manifest.toml` legitimately), `common/documentation`, `common/git_workflow`, and `common/security`.
