id: repo_structure_audit
name: Repository Structure & RTL Filelist/IP Audit (Verilog / SystemVerilog)
description: Deterministically inspect RTL/TB separation, filelists/FuseSoC/Makefile, IP pinning, and documentation, then have AI evaluate against rules.
rules:
  - common/supply_chain
  - common/documentation
  - common/git_workflow
  - common/security
  - verilog/dependencies
primitives:
  - type: project_inspect
    name: Extract Verilog/SV Layout, Filelists & Governance Facts
    with:
      lang: "verilog"
  - type: ai_interpret
    name: Evaluate Verilog/SV Build, IP Pinning & Governance
    prompt: |
      Review the deterministic ProjectFacts (`runtime_types`, `manifest_files`, `has_license`, `has_security_policy`, `ci_supply_chain_issues`, `committed_secret_files`, `readme_headings`, `docs_inventory`, `has_gitignore`).
      Verify compliance with `common/supply_chain`, `verilog/dependencies` (never penalizing RTL repos for lacking npm-style lockfiles), `common/documentation`, `common/git_workflow`, and `common/security`.
