id: fsharp_ast_audit
name: F# AST, Discriminated Unions, Async Safety, XML Docs & Security Audit
description: Parse F# AST via tree-sitter to extract XML doc coverage, mutable/null/unbox/Async.RunSynchronously hazards, complexity, and CWE sinks.
rules:
  - common/architecture
  - common/maintainability
  - common/security
  - common/security_vulnerability
  - fsharp/code_quality
  - fsharp/typing
  - fsharp/modern_stack
primitives:
  - type: ast_analyze
    name: Extract Deterministic F# AST & Module Metrics
    with:
      lang: "fsharp"
  - type: ai_interpret
    name: Interpret F# AST Facts & Evaluate Functional Safety/Typing/Security
    prompt: |
      Inspect the deterministic AstFacts (`type_safety_coverage_pct`, `weak_type_usages`, `unscoped_type_ignores`, `docstring_coverage_pct`, `missing_docstrings`, `complex_functions`, `excessive_parameters`, `bug_risk_idioms`, `global_state_usages`, `missing_io_timeouts`, `unstructured_logging`, `hardcoded_secrets`, `dangerous_sinks`, `api_endpoints`).
      Read flagged `.fs`/`.fsi` files to evaluate layering (`common/architecture`), SIG maintainability (`common/maintainability`), code security & CWE sinks (`common/security`, `common/security_vulnerability`), functional purity & DU modeling (`fsharp/code_quality`, `fsharp/typing`), and modern F# 8/9 idioms (`fsharp/modern_stack`).
