id: repo_structure_audit
name: Repository Structure & Module Manifest Audit (Go)
description: Deterministically inspect go.mod, go.sum, module dependencies, and documentation, then have AI evaluate against rules.
rules:
  - common/supply_chain
  - common/documentation
  - common/git_workflow
  - common/security
  - go/dependencies
primitives:
  - type: project_inspect
    name: Extract Go Module, Supply-Chain & Dependency Facts
    with:
      lang: "go"
  - type: ai_interpret
    name: Evaluate Go Module Build, Supply Chain & Dependencies
    prompt: |
      Review the deterministic ProjectFacts (`runtime_types`, `build_system`, `manifest_files`, `lockfiles_found`, `dependencies`, `unpinned_dependencies`, `dev_dependencies`, `has_license`, `has_security_policy`, `has_dependency_automation`, `ci_supply_chain_issues`, `committed_secret_files`, `container_hygiene_issues`, `readme_headings`, `docs_inventory`, `has_gitignore`).
      Verify compliance with `common/supply_chain`, `go/dependencies`, `common/documentation`, `common/git_workflow`, and `common/security`.
