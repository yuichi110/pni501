id: repo_structure_audit
name: Repository Structure & CUDA CMake Manifest Audit (CUDA)
description: Deterministically inspect CMakeLists.txt, CUDA architectures/toolkit settings, dependencies, and documentation, then have AI evaluate against rules.
rules:
  - common/supply_chain
  - common/documentation
  - common/git_workflow
  - common/security
  - cuda/dependencies
primitives:
  - type: project_inspect
    name: Extract CUDA Build, Supply-Chain & Governance Facts
    with:
      lang: "cuda"
  - type: ai_interpret
    name: Evaluate CUDA Build System, Supply Chain & Dependencies
    prompt: |
      Review the deterministic ProjectFacts (`runtime_types`, `build_system`, `manifest_files`, `dependencies`, `unpinned_dependencies`, `language_version_constraint`, `has_license`, `has_security_policy`, `ci_supply_chain_issues`, `committed_secret_files`, `readme_headings`, `docs_inventory`, `has_gitignore`).
      Verify compliance with `common/supply_chain`, `cuda/dependencies` (noting CUDA kernel libs legitimately omit npm-style lockfiles), `common/documentation`, `common/git_workflow`, and `common/security`.
