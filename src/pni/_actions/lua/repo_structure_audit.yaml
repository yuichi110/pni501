id: repo_structure_audit
name: Repository Structure & Rockspec Manifest Audit (Lua)
description: Deterministically inspect *.rockspec, Lua runtime bounds, dependencies, and documentation, then have AI evaluate against rules.
rules:
  - common/supply_chain
  - common/documentation
  - common/git_workflow
  - common/security
  - lua/dependencies
primitives:
  - type: project_inspect
    name: Extract Lua Rockspec, Supply-Chain & Governance Facts
    with:
      lang: "lua"
  - type: ai_interpret
    name: Evaluate Lua Build, Supply Chain & Dependencies
    prompt: |
      Review the deterministic ProjectFacts (`runtime_types`, `build_system`, `manifest_files`, `dependencies`, `unpinned_dependencies`, `language_version_constraint`, `has_license`, `has_security_policy`, `ci_supply_chain_issues`, `committed_secret_files`, `readme_headings`, `docs_inventory`, `has_gitignore`).
      Verify compliance with `common/supply_chain`, `lua/dependencies` (noting embedded Lua plugins/libs omit lockfiles legitimately), `common/documentation`, `common/git_workflow`, and `common/security`.
