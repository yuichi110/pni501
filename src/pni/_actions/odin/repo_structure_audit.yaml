id: repo_structure_audit
name: Repository Structure & Odin Collection/FFI Audit (Odin)
description: Deterministically inspect Odin package collections, ols.json/Makefile, foreign C bindings, and documentation, then have AI evaluate against rules.
rules:
  - common/supply_chain
  - common/documentation
  - common/git_workflow
  - common/security
  - odin/dependencies
primitives:
  - type: project_inspect
    name: Extract Odin Layout, Collections & Governance Facts
    with:
      lang: "odin"
  - type: ai_interpret
    name: Evaluate Odin Build, Vendored Dependencies & Governance
    prompt: |
      Review the deterministic ProjectFacts (`runtime_types`, `manifest_files`, `has_license`, `has_security_policy`, `ci_supply_chain_issues`, `committed_secret_files`, `readme_headings`, `docs_inventory`, `has_gitignore`).
      Verify compliance with `common/supply_chain`, `odin/dependencies` (never penalizing Odin repos for lacking an external package lockfile), `common/documentation`, `common/git_workflow`, and `common/security`.
