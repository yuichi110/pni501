id: starlark_ast_audit
name: Starlark / Bazel AST, Hermetic Actions, Depset & Visibility Audit
description: Parse Starlark/Bazel files via tree-sitter to extract run_shell CWE sinks, depset.to_list() traps, glob bloat, provider typing, and Stardoc coverage.
rules:
  - common/architecture
  - common/maintainability
  - common/security
  - common/security_vulnerability
  - starlark/code_quality
  - starlark/typing
  - starlark/modern_stack
primitives:
  - type: ast_analyze
    name: Extract Deterministic Starlark / Bazel AST Metrics
    with:
      lang: "starlark"
  - type: ai_interpret
    name: Interpret Starlark AST Facts & Evaluate Hermeticity/Rules/Security
    prompt: |
      Inspect the deterministic AstFacts (`docstring_coverage_pct`, `complex_functions`, `bug_risk_idioms`, `hardcoded_secrets`, `dangerous_sinks`, `modernization_hints`).
      Read flagged `.bzl`/`BUILD.bazel`/`MODULE.bazel` files to evaluate package/visibility boundaries (`common/architecture`), `run_shell` & hermeticity security (`common/security`, `common/security_vulnerability`, `starlark/code_quality`), provider/attr schemas (`starlark/typing`), and Bazel 7/8 Bzlmod idioms (`starlark/modern_stack`).
