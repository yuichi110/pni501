id: repo_structure_audit
name: Repository Structure & Copybook/Build Audit (COBOL)
description: Deterministically inspect COBOL build scripts, copybook layout, compiler dialect configuration, and documentation, then have AI evaluate against rules.
rules:
  - common/supply_chain
  - common/documentation
  - common/git_workflow
  - common/security
  - cobol/dependencies
primitives:
  - type: project_inspect
    name: Extract COBOL Build, Copybook & Governance Facts
    with:
      lang: "cobol"
  - type: ai_interpret
    name: Evaluate COBOL Build Reproducibility, Copybooks & Governance
    prompt: |
      Review the deterministic ProjectFacts (`runtime_types`, `build_system`, `manifest_files`, `language_version_constraint`, `has_license`, `has_security_policy`, `ci_supply_chain_issues`, `committed_secret_files`, `container_hygiene_issues`, `readme_headings`, `docs_inventory`, `has_gitignore`).
      Verify compliance with `common/supply_chain`, `cobol/dependencies` (never penalizing COBOL for lacking npm/Cargo-style lockfiles), `common/documentation`, `common/git_workflow`, and `common/security`.
