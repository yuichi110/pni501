id: repo_structure_audit
name: Repository Structure & Dart Sass Tooling Audit (SCSS)
description: Deterministically inspect package.json (Dart Sass vs node-sass), lockfiles, Stylelint config, and documentation, then have AI evaluate against rules.
rules:
  - common/supply_chain
  - common/documentation
  - common/git_workflow
  - common/security
  - scss/dependencies
primitives:
  - type: project_inspect
    name: Extract SCSS Tooling, Supply-Chain & Governance Facts
    with:
      lang: "scss"
  - type: ai_interpret
    name: Evaluate Dart Sass Compiler Dependencies & Governance
    prompt: |
      Review the deterministic ProjectFacts (`manifest_files`, `lockfiles_found`, `dependencies`, `dev_dependencies`, `has_license`, `has_security_policy`, `ci_supply_chain_issues`, `committed_secret_files`, `readme_headings`, `docs_inventory`, `has_gitignore`).
      Verify compliance with `common/supply_chain`, `scss/dependencies`, `common/documentation`, `common/git_workflow`, and `common/security`.
