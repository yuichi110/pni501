id: repo_structure_audit
name: Repository Structure & Composer/Legacy Packaging Audit (PHP)
description: Deterministically inspect Composer manifests/lockfiles (or legacy Composer-less raw PHP / WordPress structure) and governance, then have AI evaluate against rules.
rules:
  - common/supply_chain
  - common/documentation
  - common/git_workflow
  - common/security
  - php/dependencies
  - php/modern_stack
primitives:
  - type: project_inspect
    name: Extract PHP Composer, Legacy Raw-PHP & Supply-Chain Facts
    with:
      lang: "php"
  - type: ai_interpret
    name: Evaluate PHP Packaging, Composer Lockfile, Runtime Version & Governance
    prompt: |
      Review the deterministic ProjectFacts (`runtime_types`, `build_system`, `language_version_constraint`, `manifest_files`, `lockfiles_found`, `dependencies`, `unpinned_dependencies`, `dev_dependencies`, `detected_frameworks`, `tooling_modernization_issues`, `has_license`, `has_security_policy`, `has_dependency_automation`, `ci_supply_chain_issues`, `committed_secret_files`, `container_hygiene_issues`, `readme_headings`, `docs_inventory`, `has_gitignore`).
      Evaluate both modern Composer/PSR-4 compliance and legacy `raw_php` / EOL PHP version risks against `common/supply_chain`, `php/dependencies`, `php/modern_stack`, `common/documentation`, `common/git_workflow`, and `common/security`.
