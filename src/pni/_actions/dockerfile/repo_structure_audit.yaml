id: repo_structure_audit
name: Repository Structure & Base-Image Governance Audit (Dockerfile)
description: Deterministically inspect Dockerfiles, .dockerignore, CI supply-chain config, and documentation, then have AI evaluate against rules.
rules:
  - common/supply_chain
  - common/documentation
  - common/git_workflow
  - common/security
  - dockerfile/dependencies
primitives:
  - type: project_inspect
    name: Extract Dockerfile Layout, Supply-Chain & Governance Facts
    with:
      lang: "dockerfile"
  - type: ai_interpret
    name: Evaluate Container Base-Image Pinning, Supply Chain & Governance
    prompt: |
      Review the deterministic ProjectFacts (`manifest_files`, `container_hygiene_issues`, `has_license`, `has_security_policy`, `has_dependency_automation`, `ci_supply_chain_issues`, `committed_secret_files`, `readme_headings`, `docs_inventory`, `has_gitignore`).
      Verify compliance with `common/supply_chain`, `dockerfile/dependencies`, `common/documentation`, `common/git_workflow`, and `common/security`.
