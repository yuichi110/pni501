id: repo_structure_audit
name: Repository Structure & Bicep Registry/API Governance Audit (Bicep)
description: Deterministically inspect bicepconfig.json, ARM API versions, AVM registry tags, and documentation, then have AI evaluate against rules.
rules:
  - common/supply_chain
  - common/documentation
  - common/git_workflow
  - common/security
  - bicep/dependencies
primitives:
  - type: project_inspect
    name: Extract Bicep Config, Supply-Chain & Governance Facts
    with:
      lang: "bicep"
  - type: ai_interpret
    name: Evaluate Bicep Module Pinning, Supply Chain & Governance
    prompt: |
      Review the deterministic ProjectFacts (`manifest_files`, `has_license`, `has_security_policy`, `has_dependency_automation`, `ci_supply_chain_issues`, `committed_secret_files`, `readme_headings`, `docs_inventory`, `has_gitignore`).
      Verify compliance with `common/supply_chain`, `bicep/dependencies` (noting Bicep pins registry tags inline rather than using an npm-style lockfile), `common/documentation`, `common/git_workflow`, and `common/security`.
