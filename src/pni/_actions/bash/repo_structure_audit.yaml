id: repo_structure_audit
name: Repository Structure & Shell Tooling Audit (Bash)
description: Deterministically inspect shell script layout, CI configs, external tool checks, and documentation, then have AI evaluate against rules.
rules:
  - common/supply_chain
  - common/documentation
  - common/git_workflow
  - common/security
  - bash/dependencies
primitives:
  - type: project_inspect
    name: Extract Bash Script Layout, Supply-Chain & Governance Facts
    with:
      lang: "bash"
  - type: ai_interpret
    name: Evaluate Bash Runtime Dependencies, Supply Chain & Governance
    prompt: |
      Review the deterministic ProjectFacts (`runtime_types`, `manifest_files`, `has_license`, `has_security_policy`, `ci_supply_chain_issues`, `committed_secret_files`, `container_hygiene_issues`, `readme_headings`, `docs_inventory`, `has_gitignore`).
      Verify compliance with `common/supply_chain`, `bash/dependencies` (never penalizing shell repos for lacking npm/Cargo lockfiles), `common/documentation`, `common/git_workflow`, and `common/security`.
