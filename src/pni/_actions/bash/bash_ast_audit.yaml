id: bash_ast_audit
name: Bash / Shell AST, Strict Mode, Quoting & Command Injection Audit
description: Parse Bash AST via tree-sitter to extract strict-mode coverage, eval/unquoted command-injection CWE sinks, global state, complexity, and network timeout hygiene.
rules:
  - common/architecture
  - common/maintainability
  - common/security
  - common/security_vulnerability
  - bash/code_quality
  - bash/typing
  - bash/modern_stack
primitives:
  - type: ast_analyze
    name: Extract Deterministic Bash AST & Script Metrics
    with:
      lang: "bash"
  - type: ai_interpret
    name: Interpret Bash AST Facts & Evaluate Quoting/Injection/Hygiene
    prompt: |
      Inspect the deterministic AstFacts (`docstring_coverage_pct`, `unscoped_type_ignores`, `complex_functions`, `excessive_parameters`, `bug_risk_idioms`, `global_state_usages`, `missing_io_timeouts`, `hardcoded_secrets`, `dangerous_sinks`).
      Read flagged `.sh`/`.bash` files to evaluate script modularity (`common/architecture`, `common/maintainability`), shell command/argument injection & `curl | sh` CWE sinks (`common/security`, `common/security_vulnerability`), `set -euo pipefail`/quoting/`mktemp` traps (`bash/code_quality`, `bash/typing`), and modern safe shell idioms (`bash/modern_stack`).
