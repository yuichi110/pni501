id: haskell_ast_audit
name: Haskell AST, Totality, Strictness, Haddock & Security Audit
description: Parse Haskell AST via tree-sitter to extract Haddock coverage, partial functions, unsafePerformIO/unsafeCoerce escapes, Debug.Trace leaks, complexity, and CWE sinks.
rules:
  - common/architecture
  - common/maintainability
  - common/security
  - common/security_vulnerability
  - haskell/code_quality
  - haskell/typing
  - haskell/modern_stack
primitives:
  - type: ast_analyze
    name: Extract Deterministic Haskell AST & Module Metrics
    with:
      lang: "haskell"
  - type: ai_interpret
    name: Interpret Haskell AST Facts & Evaluate Totality/Strictness/Security
    prompt: |
      Inspect the deterministic AstFacts (`wildcard_imports`, `type_safety_coverage_pct`, `type_safety_issues`, `unscoped_type_ignores`, `docstring_coverage_pct`, `missing_docstrings`, `complex_functions`, `excessive_parameters`, `bug_risk_idioms`, `global_state_usages`, `circular_dependencies`, `missing_io_timeouts`, `unstructured_logging`, `hardcoded_secrets`, `dangerous_sinks`, `api_endpoints`).
      Read flagged `.hs` files to evaluate pure/IO layering (`common/architecture`), SIG maintainability (`common/maintainability`), security & `unsafePerformIO`/`unsafeCoerce` escapes (`common/security`, `common/security_vulnerability`), totality & strictness (`haskell/code_quality`, `haskell/typing`), and modern `Text`/`Async` idioms (`haskell/modern_stack`).
