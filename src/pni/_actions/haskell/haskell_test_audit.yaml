id: haskell_test_audit
name: Haskell Testing Standards Audit
description: Evaluate Haskell Hspec/Tasty/QuickCheck/Hedgehog suites, property coverage, pure isolation, and HPC coverage against haskell/testing standards.
rules:
  - haskell/testing
primitives:
  - type: ai_interpret
    name: Evaluate Haskell Test Suite Completeness & Property Coverage
    prompt: |
      Compare `source_files_count` vs `test_files_count` from ProjectFacts and inspect `*Spec.hs` / `*Test.hs` files and AstFacts (`test_functions_count`, `assertion_free_tests`, `module_test_coverage_pct`) to verify Hspec/Tasty/QuickCheck coverage and determinism according to `haskell/testing`.
