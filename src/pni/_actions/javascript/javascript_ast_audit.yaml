id: javascript_ast_audit
name: JavaScript AST, Imports, JSDoc Types, Quality & Security Audit
description: Parse JavaScript/JSX AST via ast-grep-py to extract import/require hygiene, JSDoc type contract coverage, cognitive complexity, bug idioms, CWE sinks, and API routes.
rules:
  - common/architecture
  - common/maintainability
  - common/security
  - common/security_vulnerability
  - javascript/code_quality
  - javascript/typing
primitives:
  - type: ast_analyze
    name: Extract Deterministic JavaScript AST & Module Metrics
    with:
      lang: "javascript"
  - type: ai_interpret
    name: Interpret JavaScript AST Facts & Evaluate Quality/JSDoc-Types/Imports/Security
    prompt: |
      Inspect the deterministic AstFacts (`import_hygiene_coverage_pct`, `unsorted_imports`, `wildcard_imports`, `late_imports`, `type_safety_coverage_pct`, `type_safety_issues`, `weak_type_usages`, `unscoped_type_ignores`, `docstring_coverage_pct`, `missing_docstrings`, `empty_docstrings`, `doc_signature_mismatches`, `complex_functions`, `excessive_parameters`, `bug_risk_idioms`, `global_state_usages`, `circular_dependencies`, `unused_dependencies`, `undeclared_dependencies`, `missing_io_timeouts`, `scattered_env_access`, `unstructured_logging`, `hardcoded_secrets`, `dangerous_sinks`, `api_endpoints`).
      Read the flagged `.js`/`.jsx`/`.mjs` files to evaluate module layering (`common/architecture`), SIG maintainability (`common/maintainability`), code security, CWE sinks & API boundaries (`common/security`, `common/security_vulnerability`), JSDoc & modern ES hygiene (`javascript/code_quality`), and JSDoc type contracts (`javascript/typing`).
