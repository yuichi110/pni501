id: repo_structure_audit
name: Repository Structure & Provider/Module Pinning Audit (HCL / Terraform)
description: Deterministically inspect versions.tf, .terraform.lock.hcl, provider/module pins, and documentation, then have AI evaluate against rules.
rules:
  - common/supply_chain
  - common/documentation
  - common/git_workflow
  - common/security
  - hcl/dependencies
primitives:
  - type: project_inspect
    name: Extract HCL / Terraform Provider, Supply-Chain & Governance Facts
    with:
      lang: "hcl"
  - type: ai_interpret
    name: Evaluate Terraform Provider Pinning, State Governance & Supply Chain
    prompt: |
      Review the deterministic ProjectFacts (`manifest_files`, `lockfiles_found`, `dependencies`, `unpinned_dependencies`, `has_license`, `has_security_policy`, `has_dependency_automation`, `ci_supply_chain_issues`, `committed_secret_files`, `readme_headings`, `docs_inventory`, `has_gitignore`).
      Verify compliance with `common/supply_chain`, `hcl/dependencies` (noting reusable shared modules omit `.terraform.lock.hcl` by convention), `common/documentation`, `common/git_workflow`, and `common/security`.
