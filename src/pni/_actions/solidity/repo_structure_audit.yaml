id: repo_structure_audit
name: Repository Structure & Foundry/Hardhat Manifest Audit (Solidity)
description: Deterministically inspect foundry.toml, hardhat.config.*, Solidity pragma/compiler pins, audited library dependencies, and documentation, then have AI evaluate against rules.
rules:
  - common/supply_chain
  - common/documentation
  - common/git_workflow
  - common/security
  - solidity/dependencies
primitives:
  - type: project_inspect
    name: Extract Solidity Foundry/Hardhat, Supply-Chain & Dependency Facts
    with:
      lang: "solidity"
  - type: ai_interpret
    name: Evaluate Solidity Build, Supply Chain & Library Dependencies
    prompt: |
      Review the deterministic ProjectFacts (`runtime_types`, `build_system`, `manifest_files`, `lockfiles_found`, `dependencies`, `unpinned_dependencies`, `language_version_constraint`, `has_license`, `has_security_policy`, `ci_supply_chain_issues`, `committed_secret_files`, `readme_headings`, `docs_inventory`, `has_gitignore`).
      Verify compliance with `common/supply_chain`, `solidity/dependencies`, `common/documentation`, `common/git_workflow`, and `common/security`.
