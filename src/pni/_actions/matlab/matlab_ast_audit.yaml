id: matlab_ast_audit
name: MATLAB AST, Matrix Safety, Arguments Validation & Security Audit
description: Parse MATLAB AST via tree-sitter to extract eval/evalin/system CWE sinks, global state abuse, help-header docs, loop pre-allocation, and function complexity.
rules:
  - common/architecture
  - common/maintainability
  - common/security
  - common/security_vulnerability
  - matlab/code_quality
  - matlab/typing
  - matlab/modern_stack
primitives:
  - type: ast_analyze
    name: Extract Deterministic MATLAB AST & Function Metrics
    with:
      lang: "matlab"
  - type: ai_interpret
    name: Interpret MATLAB AST Facts & Evaluate Numerical/Code Safety
    prompt: |
      Inspect the deterministic AstFacts (`docstring_coverage_pct`, `unscoped_type_ignores`, `complex_functions`, `excessive_parameters`, `bug_risk_idioms`, `global_state_usages`, `missing_io_timeouts`, `unstructured_logging`, `hardcoded_secrets`, `dangerous_sinks`).
      Read flagged `.m` files to evaluate `+package`/class layering (`common/architecture`), SIG maintainability (`common/maintainability`), `eval`/`system` CWE sinks (`common/security`, `common/security_vulnerability`), `arguments` validation & `global`/`clear all` hygiene (`matlab/code_quality`, `matlab/typing`), and modern MATLAB idioms (`matlab/modern_stack`).
