id: repo_structure_audit
name: Repository Structure & Toolbox Governance Audit (MATLAB)
description: Deterministically inspect MATLAB project layout, toolbox metadata, hardcoded paths, and documentation, then have AI evaluate against rules.
rules:
  - common/supply_chain
  - common/documentation
  - common/git_workflow
  - common/security
  - matlab/dependencies
primitives:
  - type: project_inspect
    name: Extract MATLAB Layout, Toolbox & Governance Facts
    with:
      lang: "matlab"
  - type: ai_interpret
    name: Evaluate MATLAB Toolbox Dependencies, Paths & Governance
    prompt: |
      Review the deterministic ProjectFacts (`runtime_types`, `manifest_files`, `has_license`, `has_security_policy`, `ci_supply_chain_issues`, `committed_secret_files`, `readme_headings`, `docs_inventory`, `has_gitignore`).
      Verify compliance with `common/supply_chain`, `matlab/dependencies` (noting MATLAB repos do not use npm-style lockfiles), `common/documentation`, `common/git_workflow`, and `common/security`.
