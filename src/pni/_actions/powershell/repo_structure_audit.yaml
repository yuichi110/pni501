id: repo_structure_audit
name: Repository Structure & Module Manifest Audit (PowerShell)
description: Deterministically inspect .psd1 module manifests, #Requires headers, dependencies, and documentation, then have AI evaluate against rules.
rules:
  - common/supply_chain
  - common/documentation
  - common/git_workflow
  - common/security
  - powershell/dependencies
primitives:
  - type: project_inspect
    name: Extract PowerShell Manifest, Supply-Chain & Governance Facts
    with:
      lang: "powershell"
  - type: ai_interpret
    name: Evaluate PowerShell Module Manifests, Supply Chain & Governance
    prompt: |
      Review the deterministic ProjectFacts (`runtime_types`, `manifest_files`, `dependencies`, `unpinned_dependencies`, `language_version_constraint`, `has_license`, `has_security_policy`, `ci_supply_chain_issues`, `committed_secret_files`, `container_hygiene_issues`, `readme_headings`, `docs_inventory`, `has_gitignore`).
      Verify compliance with `common/supply_chain`, `powershell/dependencies` (noting `.psd1` pins suffice without npm-style lockfiles), `common/documentation`, `common/git_workflow`, and `common/security`.
