id: repo_structure_audit
name: Repository Structure & Stylesheet Tooling Audit (CSS)
description: Deterministically inspect CSS layout, browserslist/stylelint config, external font/CDN assets, and documentation, then have AI evaluate against rules.
rules:
  - common/supply_chain
  - common/documentation
  - common/git_workflow
  - common/security
  - css/dependencies
primitives:
  - type: project_inspect
    name: Extract CSS Layout, Tooling & Governance Facts
    with:
      lang: "css"
  - type: ai_interpret
    name: Evaluate CSS External Assets, Browserslist & Governance
    prompt: |
      Review the deterministic ProjectFacts (`manifest_files`, `has_license`, `has_security_policy`, `ci_supply_chain_issues`, `committed_secret_files`, `readme_headings`, `docs_inventory`, `has_gitignore`).
      Verify compliance with `common/supply_chain`, `css/dependencies` (noting standalone CSS repos omit lockfiles legitimately), `common/documentation`, `common/git_workflow`, and `common/security`.
