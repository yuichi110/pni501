id: repo_structure_audit
name: Repository Structure & Package Manifest Audit (TypeScript)
description: Deterministically inspect package.json, tsconfig.json, lockfiles, and documentation, then have AI evaluate against rules.
rules:
  - common/supply_chain
  - common/documentation
  - common/git_workflow
  - common/security
  - typescript/dependencies
primitives:
  - type: project_inspect
    name: Extract TypeScript Package, Compiler & Supply-Chain Facts
    with:
      lang: "typescript"
  - type: ai_interpret
    name: Evaluate Node/TypeScript Build, Supply Chain & Dependencies
    prompt: |
      Review the deterministic ProjectFacts (`runtime_types`, `build_system`, `manifest_files`, `lockfiles_found`, `dependencies`, `unpinned_dependencies`, `dev_dependencies`, `tooling_issues`, `has_license`, `has_security_policy`, `has_dependency_automation`, `ci_supply_chain_issues`, `committed_secret_files`, `container_hygiene_issues`, `readme_headings`, `docs_inventory`, `has_gitignore`).
      Verify compliance with `common/supply_chain`, `typescript/dependencies`, `common/documentation`, `common/git_workflow`, and `common/security`.
