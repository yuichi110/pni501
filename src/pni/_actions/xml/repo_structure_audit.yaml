id: repo_structure_audit
name: Repository Structure & XML Catalog/Manifest Governance Audit (XML)
description: Deterministically inspect XML/XSD layout, local schema catalogs, secret-file hygiene, and documentation, then have AI evaluate against rules.
rules:
  - common/supply_chain
  - common/documentation
  - common/git_workflow
  - common/security
  - xml/dependencies
primitives:
  - type: project_inspect
    name: Extract XML Layout, Catalog & Governance Facts
    with:
      lang: "xml"
  - type: ai_interpret
    name: Evaluate XML Schema Catalogs, Secret Hygiene & Governance
    prompt: |
      Review the deterministic ProjectFacts (`manifest_files`, `has_license`, `has_security_policy`, `ci_supply_chain_issues`, `committed_secret_files`, `readme_headings`, `docs_inventory`, `has_gitignore`).
      Verify compliance with `common/supply_chain`, `xml/dependencies` (noting standalone XML schema repos omit npm-style lockfiles legitimately), `common/documentation`, `common/git_workflow`, and `common/security`.
