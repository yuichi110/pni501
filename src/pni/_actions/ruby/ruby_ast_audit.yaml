id: ruby_ast_audit
name: Ruby AST, Metaprogramming Safety, YARD Docs & Security Audit
description: Parse Ruby AST via tree-sitter to extract YARD/RDoc coverage, complexity, bare rescues, unsafe eval/YAML.load/Marshal.load, mutable global/class state, CWE sinks, and Rails/Sinatra routes.
rules:
  - common/architecture
  - common/maintainability
  - common/security
  - common/security_vulnerability
  - ruby/code_quality
  - ruby/typing
  - ruby/modern_stack
primitives:
  - type: ast_analyze
    name: Extract Deterministic Ruby AST & Module Metrics
    with:
      lang: "ruby"
  - type: ai_interpret
    name: Interpret Ruby AST Facts & Evaluate Quality/Contracts/Security
    prompt: |
      Inspect the deterministic AstFacts (`docstring_coverage_pct`, `missing_docstrings`, `type_safety_coverage_pct`, `weak_type_usages`, `unscoped_type_ignores`, `complex_functions`, `excessive_parameters`, `bug_risk_idioms`, `global_state_usages`, `circular_dependencies`, `missing_io_timeouts`, `scattered_env_access`, `unstructured_logging`, `hardcoded_secrets`, `dangerous_sinks`, `api_endpoints`).
      Read flagged `.rb` files to evaluate layering (`common/architecture`), SIG maintainability (`common/maintainability`), code security & CWE sinks (`common/security`, `common/security_vulnerability`), Ruby safety & YARD hygiene (`ruby/code_quality`, `ruby/typing`), and modern Ruby/Rails idioms (`ruby/modern_stack`).
