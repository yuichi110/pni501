id: repo_structure_audit
name: Repository Structure & Pubspec Manifest Audit (Dart)
description: Deterministically inspect pubspec.yaml, pubspec.lock, Dart SDK bounds, dependencies, and documentation, then have AI evaluate against rules.
rules:
  - common/supply_chain
  - common/documentation
  - common/git_workflow
  - common/security
  - dart/dependencies
primitives:
  - type: project_inspect
    name: Extract Dart Pub, Supply-Chain & Dependency Facts
    with:
      lang: "dart"
  - type: ai_interpret
    name: Evaluate Dart Pub Build, Supply Chain & Dependencies
    prompt: |
      Review the deterministic ProjectFacts (`runtime_types`, `build_system`, `manifest_files`, `lockfiles_found`, `dependencies`, `unpinned_dependencies`, `dev_dependencies`, `language_version_constraint`, `has_license`, `has_security_policy`, `has_dependency_automation`, `ci_supply_chain_issues`, `committed_secret_files`, `container_hygiene_issues`, `readme_headings`, `docs_inventory`, `has_gitignore`).
      Verify compliance with `common/supply_chain`, `dart/dependencies` (noting pure `pub.dev` library packages intentionally omit `pubspec.lock`), `common/documentation`, `common/git_workflow`, and `common/security`.
