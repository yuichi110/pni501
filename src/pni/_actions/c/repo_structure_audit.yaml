id: repo_structure_audit
name: Repository Structure & Build Manifest Audit (C)
description: Deterministically inspect CMakeLists.txt, meson.build, Makefile, C standard flags, vendored libs, and documentation, then have AI evaluate against rules.
rules:
  - common/supply_chain
  - common/documentation
  - common/git_workflow
  - common/security
  - c/dependencies
primitives:
  - type: project_inspect
    name: Extract C Build, Supply-Chain & Dependency Facts
    with:
      lang: "c"
  - type: ai_interpret
    name: Evaluate C Build System, Supply Chain & Dependencies
    prompt: |
      Review the deterministic ProjectFacts (`runtime_types`, `build_system`, `manifest_files`, `lockfiles_found`, `dependencies`, `unpinned_dependencies`, `language_version_constraint`, `has_license`, `has_security_policy`, `has_dependency_automation`, `ci_supply_chain_issues`, `committed_secret_files`, `container_hygiene_issues`, `readme_headings`, `docs_inventory`, `has_gitignore`).
      Verify compliance with `common/supply_chain`, `c/dependencies` (noting zero-dependency C libraries do not require a lockfile), `common/documentation`, `common/git_workflow`, and `common/security`.
