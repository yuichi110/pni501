id: repo_structure_audit
name: Repository Structure & .NET Project Manifest Audit (C#)
description: Deterministically inspect *.csproj, *.sln, Directory.Packages.props, packages.lock.json, and documentation, then have AI evaluate against rules.
rules:
  - common/supply_chain
  - common/documentation
  - common/git_workflow
  - common/security
  - csharp/dependencies
primitives:
  - type: project_inspect
    name: Extract .NET Project, Supply-Chain & NuGet Facts
    with:
      lang: "csharp"
  - type: ai_interpret
    name: Evaluate .NET Build, Supply Chain & NuGet Dependencies
    prompt: |
      Review the deterministic ProjectFacts (`runtime_types`, `build_system`, `manifest_files`, `lockfiles_found`, `dependencies`, `unpinned_dependencies`, `dev_dependencies`, `language_version_constraint`, `has_license`, `has_security_policy`, `has_dependency_automation`, `ci_supply_chain_issues`, `committed_secret_files`, `container_hygiene_issues`, `readme_headings`, `docs_inventory`, `has_gitignore`).
      Verify compliance with `common/supply_chain`, `csharp/dependencies`, `common/documentation`, `common/git_workflow`, and `common/security`.
