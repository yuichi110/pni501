id: repo_structure_audit
name: Repository Structure & CPAN Manifest Audit (Perl)
description: Deterministically inspect cpanfile, cpanfile.snapshot, Makefile.PL, Build.PL, Perl version floors, and documentation, then have AI evaluate against rules.
rules:
  - common/supply_chain
  - common/documentation
  - common/git_workflow
  - common/security
  - perl/dependencies
primitives:
  - type: project_inspect
    name: Extract Perl CPAN, Supply-Chain & Dependency Facts
    with:
      lang: "perl"
  - type: ai_interpret
    name: Evaluate Perl CPAN Build, Supply Chain & Dependencies
    prompt: |
      Review the deterministic ProjectFacts (`runtime_types`, `build_system`, `manifest_files`, `lockfiles_found`, `dependencies`, `unpinned_dependencies`, `dev_dependencies`, `language_version_constraint`, `has_license`, `has_security_policy`, `has_dependency_automation`, `ci_supply_chain_issues`, `committed_secret_files`, `container_hygiene_issues`, `readme_headings`, `docs_inventory`, `has_gitignore`).
      Verify compliance with `common/supply_chain`, `perl/dependencies` (noting standalone core-module scripts/CPAN dists legitimately omit `cpanfile.snapshot`), `common/documentation`, `common/git_workflow`, and `common/security`.
